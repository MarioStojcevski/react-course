<!DOCTYPE html>
<html>
  <head>
    <title>Store - Vanilla JS</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.6;
      }

      h1 { color: #333; }

      .search-box {
        margin-bottom: 20px;
      }

      .search-box input {
        padding: 10px;
        width: 100%;
        max-width: 400px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
      }

      .product {
        display: flex;
        gap: 16px;
        padding: 16px;
        border-bottom: 1px solid #eee;
      }

      .product img {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 4px;
      }

      .product h3 {
        margin: 0 0 4px;
      }

      .product .description {
        color: #666;
        font-size: 0.9em;
        margin: 0 0 8px;
      }

      .product .price {
        color: #2c7a2c;
        font-weight: bold;
        font-size: 1.2em;
      }

      .product .old-price {
        text-decoration: line-through;
        color: #999;
        margin-left: 8px;
      }

      .product .category {
        display: inline-block;
        background: #f0f0f0;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 0.8em;
        color: #666;
        margin-top: 4px;
      }

      .error {
        color: red;
        padding: 20px;
        background: #fff5f5;
        border-radius: 4px;
      }

      .loading {
        color: gray;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Store</h1>

    <div class="search-box">
      <input type="text" id="search" placeholder="Search products...">
    </div>

    <div id="app"></div>

    <script>
      let allProducts = [];

      async function loadProducts() {
        const app = document.getElementById('app');

        // Show loading state
        app.innerHTML = '<p class="loading">Loading...</p>';

        try {
          const response = await fetch('https://dummyjson.com/products?limit=20');
          const data = await response.json();

          allProducts = data.products;
          renderProducts(allProducts);
        } catch (error) {
          app.innerHTML = '<p class="error">Failed to load products. Check your connection.</p>';
        }
      }

      function renderProducts(products) {
        const app = document.getElementById('app');

        if (products.length === 0) {
          app.innerHTML = '<p class="loading">No products found.</p>';
          return;
        }

        app.innerHTML = '';

        products.forEach(product => {
          const originalPrice = Math.round(product.price / (1 - product.discountPercentage / 100));

          const div = document.createElement('div');
          div.className = 'product';
          div.innerHTML = `
            <img src="${product.thumbnail}" alt="${product.title}">
            <div>
              <h3>${product.title}</h3>
              <p class="description">${product.description}</p>
              <span class="price">$${product.price}</span>
              <span class="old-price">$${originalPrice}</span>
              <br>
              <span class="category">${product.category}</span>
            </div>
          `;
          app.appendChild(div);
        });
      }

      // Search functionality
      document.getElementById('search').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = allProducts.filter(p =>
          p.title.toLowerCase().includes(query) ||
          p.description.toLowerCase().includes(query) ||
          p.category.toLowerCase().includes(query)
        );
        renderProducts(filtered);
      });

      // Load products on page load
      loadProducts();
    </script>
  </body>
</html>
