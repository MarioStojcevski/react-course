<!DOCTYPE html>
<html>
  <head>
    <title>Store - Solution</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.6;
      }

      h1 { color: #333; }

      .filters {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .filters input, .filters select {
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
      }

      .filters input {
        flex: 1;
        min-width: 200px;
      }

      .filters select {
        min-width: 180px;
      }

      .count {
        color: #666;
        margin-bottom: 16px;
        font-size: 0.9em;
      }

      .product {
        display: flex;
        gap: 16px;
        padding: 16px;
        border-bottom: 1px solid #eee;
      }

      .product img {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 4px;
      }

      .product h3 {
        margin: 0 0 4px;
      }

      .product .description {
        color: #666;
        font-size: 0.9em;
        margin: 0 0 8px;
      }

      .product .price {
        color: #2c7a2c;
        font-weight: bold;
        font-size: 1.2em;
      }

      .product .old-price {
        text-decoration: line-through;
        color: #999;
        margin-left: 8px;
      }

      .product .category {
        display: inline-block;
        background: #f0f0f0;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 0.8em;
        color: #666;
        margin-top: 4px;
      }

      .error {
        color: red;
        padding: 20px;
        background: #fff5f5;
        border-radius: 4px;
      }

      .loading {
        color: gray;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Store</h1>

    <div class="filters">
      <input type="text" id="search" placeholder="Search products...">
      <select id="category">
        <option value="">All Categories</option>
      </select>
    </div>

    <p class="count" id="count"></p>

    <div id="app"></div>

    <script>
      let allProducts = [];
      let categories = [];
      let currentCategory = '';
      let searchQuery = '';

      async function loadProducts() {
        const app = document.getElementById('app');
        app.innerHTML = '<p class="loading">Loading...</p>';

        try {
          const response = await fetch('https://dummyjson.com/products?limit=100');
          const data = await response.json();
          allProducts = data.products;

          categories = [...new Set(allProducts.map(p => p.category))].sort();
          populateCategories();
          applyFilters();
        } catch (error) {
          app.innerHTML = '<p class="error">Failed to load products. Check your connection.</p>';
        }
      }

      function populateCategories() {
        const select = document.getElementById('category');
        categories.forEach(cat => {
          const option = document.createElement('option');
          option.value = cat;
          option.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
          select.appendChild(option);
        });
      }

      function applyFilters() {
        let filtered = allProducts;

        if (currentCategory) {
          filtered = filtered.filter(p => p.category === currentCategory);
        }

        if (searchQuery) {
          filtered = filtered.filter(p =>
            p.title.toLowerCase().includes(searchQuery) ||
            p.description.toLowerCase().includes(searchQuery) ||
            p.category.toLowerCase().includes(searchQuery)
          );
        }

        renderProducts(filtered);
      }

      function renderProducts(products) {
        const app = document.getElementById('app');
        const count = document.getElementById('count');

        count.textContent = `${products.length} product${products.length !== 1 ? 's' : ''} found`;

        if (products.length === 0) {
          app.innerHTML = '<p class="loading">No products found.</p>';
          return;
        }

        app.innerHTML = '';

        products.forEach(product => {
          const originalPrice = Math.round(product.price / (1 - product.discountPercentage / 100));

          const div = document.createElement('div');
          div.className = 'product';
          div.innerHTML = `
            <img src="${product.thumbnail}" alt="${product.title}">
            <div>
              <h3>${product.title}</h3>
              <p class="description">${product.description}</p>
              <span class="price">$${product.price}</span>
              <span class="old-price">$${originalPrice}</span>
              <br>
              <span class="category">${product.category}</span>
            </div>
          `;
          app.appendChild(div);
        });
      }

      document.getElementById('search').addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase();
        applyFilters();
      });

      document.getElementById('category').addEventListener('change', (e) => {
        currentCategory = e.target.value;
        applyFilters();
      });

      loadProducts();
    </script>
  </body>
</html>
