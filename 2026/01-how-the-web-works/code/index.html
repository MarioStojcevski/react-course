<!DOCTYPE html>
<html>
  <head>
    <title>My First Page</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.6;
      }
      h1 { color: #333; }
      #output { color: #666; font-style: italic; }
      button {
        padding: 8px 16px;
        margin: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Hello, World!</h1>
    <p id="output"></p>
    <button onclick="changeText()">Change Text</button>
    <button onclick="changeColor()">Change Color</button>
    <button onclick="addElement()">Add Element</button>

    <div id="container"></div>

    <script>
      // Change paragraph text
      function changeText() {
        document.getElementById('output').textContent = 'JavaScript changed this!';
      }

      // Change heading color
      function changeColor() {
        const colors = ['red', 'blue', 'green', 'purple', 'orange'];
        const random = colors[Math.floor(Math.random() * colors.length)];
        document.querySelector('h1').style.color = random;
      }

      // Add a new element to the page
      function addElement() {
        const div = document.createElement('div');
        div.textContent = 'New element added at ' + new Date().toLocaleTimeString();
        div.style.padding = '10px';
        div.style.margin = '10px 0';
        div.style.background = '#f0f0f0';
        div.style.borderRadius = '4px';
        document.getElementById('container').appendChild(div);
      }

      // Log to console on page load
      document.getElementById('output').textContent = 'Page loaded. Click a button!';
      console.log('Page loaded successfully');
    </script>
  </body>
</html>
